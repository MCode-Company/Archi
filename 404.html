<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony — LINIA</title>
<meta name="robots" content="noindex">
<script>
  // Na GitHub Pages strona działa pod /<nazwa-repo>/, na Vercelu i własnej domenie pod /
  (function () {
    var seg = location.pathname.split('/')[1];
    var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
    document.write('<base href="' + base + '">');
  })();
</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter+Tight:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap" style="min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:32px;padding-block:96px">
  <p class="label"><span class="num">404 /</span> Nie znaleziono</p>
  <h1 class="display">Tej strony<br><span class="serif">tu nie ma.</span></h1>
  <p class="lead muted" style="max-width:40ch">Mogła zostać przeniesiona albo adres jest błędny. Zapraszam na stronę główną.</p>
  <p><a class="btn" href="./">Wróć na stronę główną <span aria-hidden="true">→</span></a></p>
</main>
</body>
</html>
